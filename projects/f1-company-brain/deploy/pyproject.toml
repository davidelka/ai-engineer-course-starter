# The dependencies of the Company Brain container image, pinned exactly by uv.lock.
# Change a dependency here, then run `uv lock` in this folder and commit both files.
# The local e5-small embedder (PyTorch CPU + sentence-transformers) is NOT here: the Dockerfile's
# `runtime-e5` target adds it from the PyTorch CPU index, pinned there (see the comments in the Dockerfile).
[project]
name = "company-brain"
version = "1.0.0"
description = "Acme Company Brain (AI Engineer course, final project F1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "httpx>=0.28.1",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "sqlglot>=30.27.0",                 # datakit's SQL guard (text-to-SQL)
    "pypdf>=6.0",                       # ingestion of the corpus PDFs
    "python-docx>=1.2",                 # ... and the DOCX
    "beautifulsoup4>=4.12",             # ... and the HTML pages
    "lxml>=5.0",
    "tiktoken>=0.8",                    # token counts for context packing
    "pillow>=12.0",                     # nothing in the image imports it (llmkit.media reads image headers
                                        # itself); runtime-e5's sentence-transformers pulls it in anyway.
                                        # Removable from "runtime": drop this line, run `uv lock`, rebuild.
    "langgraph>=1.2.19",                # the approval workflow (lesson 16)
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",                       # the MCP server (lesson 17)
    "opentelemetry-sdk>=1.45",          # obskit traces (lesson 22)
    "opentelemetry-exporter-otlp-proto-http>=1.45",   # OTLP to Phoenix / a collector
]

[tool.uv]
# The code (cbrain/, acmeqa/ and the course packages) is copied into the image, not installed.
package = false
