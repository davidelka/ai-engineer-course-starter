  - description: "q072 [unanswerable] Who is Acme's General Counsel?"
    vars:
      qid: q072
      qtype: unanswerable
      question: "Who is Acme's General Counsel?"
      user_message: "<sources>\n<source id=\"1\" doc=\"hr-expenses\" title=\"Business Expenses and Reimbursement Policy\" section=\"Business Expenses and Reimbursement Policy\" effective_date=\"2026-01-01\" version=\"3.0\">\n# Business Expenses and Reimbursement Policy\n\nThis policy covers everyday business expenses that employees pay out of pocket and claim back. Travel expenses (flights, hotels, per diem) are covered by the Travel Policy. Purchases from vendors that require a purchase order are covered by the Procurement Policy.\n\n## General principles\n\n- Spend company money as if it were your own. Choose reasonable options, not the cheapest or the most expensive.\n- Every expense must have a clear business purpose that you can explain in one sentence.\n- Claims are submitted in Spendwise, Acme's expense system, within 60 days of the purchase. Claims submitted later are rejected unless the Controller approves an exception.\n- A receipt is required for every expense above 50 NIS (or 15 EUR for Berlin employees). Photos of receipts are accepted.\n</source>\n<source id=\"2\" doc=\"co-glossary\" title=\"Acme Glossary of Internal Terms\" section=\"Acme Glossary of Internal Terms &gt; Code names and internal tools\" effective_date=\"2026-09-01\" version=\"2026.3\">\n## Code names and internal tools\n\n- **Kestrel:** the project to rewrite the execution layer of flow-engine with a new storage model for run checkpoints. Owned by the Engine team. Running in shadow mode since June 2026; general availability planned for Q1 2027.\n- **Tidewater:** the EU data residency project that launched the eu-central-1 (Frankfurt) region in October 2025.\n- **Orca:** the 2025 migration of all services from self-managed virtual machines to Kubernetes (Amazon EKS). Completed in November 2025. \"Post-Orca node groups\" means the managed Kubernetes node groups created in that migration.\n- **Conveyor:** the CI/CD pipeline owned by the Platform team. Every production change goes through it.\n- **Lighthouse:** the analytics data warehouse (ClickHouse) owned by the Data team. The service is called `lighthouse` in the Service Catalog.\n- **Bridge:** the old name of connectors-hub, still used in some dashboards and older documents.\n- **Fixit:** the IT ticketing system. Emails to it@acme.example create Fixit tickets.\n- **Pulse:** the HR portal (built on HiBob), used for vacation requests, sick days, payslips, reviews and benefits.\n- **Spendwise:** the expense system.\n- **TripDesk:** the travel booking tool.\n- **Forge:** Acme's yearly internal hackathon.\n</source>\n<source id=\"3\" doc=\"eng-leads-sync-2026-05\" title=\"Engineering Leads Sync - May 14, 2026\" section=\"Engineering Leads Sync - May 14, 2026\" effective_date=\"2026-05-14\" version=\"1.0\">\n# Engineering Leads Sync - May 14, 2026\n\n**Attendees:** Michal Ben-David (chair), Itai Barak, Dana Levi, Omer Haddad, Rina Sasson, Gil Avraham, Maya Rosen, Eitan Klein, Boaz Nahum, Tamar Golan (for item 4)\n**Notes by:** Maya Rosen\n\n## 1. Kestrel status (Dana)\n\n- Shadow mode will start in June with 5% of runs in il-central-1 only.\n- Checkpoint write load in shadow mode is 61% lower than the current engine in load tests.\n- Target for general availability: Q1 2027. Dana is worried about the Q4 hiring plan; two open positions in the Engine team are still not filled.\n</source>\n<source id=\"4\" doc=\"sales-sla-2025\" title=\"Acme Flow Service Level Agreement (2025)\" section=\"Acme Flow Service Level Agreement (2025)\" effective_date=\"2025-01-01\" version=\"1.0\">\n## 4. Exclusions\n\nDowntime does not count against uptime when caused by scheduled maintenance announced at least 72 hours in advance (up to 4 hours per month), by third-party services outside Acme's control (including connected third-party tools), by the customer's own actions, or by force majeure.\n\n## 5. Sole remedy\n\nService credits are the customer's sole and exclusive remedy for failure to meet the uptime commitment.\n</source>\n<source id=\"5\" doc=\"eng-deploy-process\" title=\"Deploy Process for Acme Flow\" section=\"Deploy Process for Acme Flow\" effective_date=\"2026-09-01\" version=\"2.2\">\n# Deploy Process for Acme Flow\n\nAll production changes to Acme Flow go through Conveyor, the Platform team's CI/CD pipeline. There is no other supported way to change production. Manual changes with `kubectl` in production are allowed only during an active incident, by the incident's on-call engineer, and must be recorded in the incident channel.\n</source>\n</sources>\n\n<question>Who is Acme's General Counsel?</question>"
      expected: "{\"answer\": \"not in the documents\", \"answer_facts\": [], \"source_ids\": [], \"stale_ids\": []}"
