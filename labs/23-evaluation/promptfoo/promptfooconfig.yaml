tests:
  - description: "q001 [version_conflict] How many unused vacation days can I carry over to next year, and when "
    vars:
      qid: q001
      qtype: version_conflict
      question: "How many unused vacation days can I carry over to next year, and when do they expire?"
      user_message: "<sources>\n<source id=\"1\" doc=\"hr-vacation-2026\" title=\"Vacation Policy (2026)\" section=\"Vacation Policy (effective January 2026)\" effective_date=\"2026-01-01\" version=\"2.0\">\n## Carry-over\n\n- Up to 5 unused days may be carried over to the next calendar year. Carried-over days expire on March 31.\n- Days above the carry-over limit are lost at the end of the year unless the VP People approved an exception in writing, for example because the employee could not take vacation due to reserve duty.\n\n## Requesting vacation\n\n- Vacation requests of 3 days or more must be submitted in the HR portal at least 2 weeks in advance and approved by the direct manager.\n- Shorter requests (1-2 days) can be submitted up to one working day in advance.\n- Managers should answer within 3 working days. Unanswered requests are escalated to the manager's manager automatically.\n- Vacation during the last two weeks of a quarter for employees in Sales and Customer Support also requires the approval of the department VP.\n</source>\n<source id=\"2\" doc=\"hr-vacation-2024\" title=\"Vacation Policy (2024)\" section=\"Vacation Policy (effective January 2024)\" effective_date=\"2024-01-01\" version=\"1.0\">\n## Carry-over\n\n- Up to 3 unused days may be carried over to the next calendar year.\n- Carried-over days expire on February 28 of the following year. Days that are not used by then are lost and are not paid out.\n- Exceptions require written approval from the VP People.\n\n## Requesting vacation\n\n- Vacation requests of 3 days or more must be submitted in the HR portal at least 1 week in advance and approved by the direct manager.\n- Requests of 1-2 days can be submitted up to one working day in advance.\n- Managers should respond to a request within 3 working days. A request that was not answered within that time is escalated automatically to the manager's manager.\n</source>\n<source id=\"3\" doc=\"hr-vacation-2026\" title=\"Vacation Policy (2026)\" section=\"Vacation Policy (effective January 2026)\" effective_date=\"2026-01-01\" version=\"2.0\">\n## Company shutdown week\n\nDuring the company-wide shutdown week (between Rosh Hashanah and Yom Kippur), 3 vacation days are deducted automatically. On-call engineers who work during the shutdown week keep those days and may use them later in the year.\n\n## What changed compared to 2024\n\n- First-year allowance increased from 12 to 14 days, and the maximum from 22 to 24 days.\n- Carry-over increased from 3 to 5 days, and the expiry date moved from February 28 to March 31.\n- The advance notice for requests of 3 days or more increased from 1 week to 2 weeks.\n\n## Questions\n\nQuestions about this policy should be sent to the People team in the #ask-people Slack channel or to Sivan Elbaz, HR Manager.\n</source>\n<source id=\"4\" doc=\"hr-sick-leave\" title=\"Sick Leave Policy\" section=\"Sick Leave Policy\" effective_date=\"2025-07-01\" version=\"1.2\">\n# Sick Leave Policy\n\n## Purpose\n\nEmployees should stay home when they are sick, recover, and not worry about losing pay. This policy explains how sick days accrue, how they are paid at Acme, and what documentation is required.\n\n## Accrual\n\n- Employees in Israel accrue 1.5 sick days per month of employment, up to 18 days per year, as required by law.\n- Unused sick days carry over from year to year up to a maximum accumulated balance of 90 days.\n- Sick days are not paid out when an employee leaves the company.\n\n## Pay\n\nIsraeli law allows the employer to leave the first sick day unpaid and pay 50% for the second and third days. Acme does not use this option: Acme pays 100% of the salary from the first sick day, as long as the employee has a positive sick-day balance.\n</source>\n<source id=\"5\" doc=\"hr-vacation-2024\" title=\"Vacation Policy (2024)\" section=\"Vacation Policy (effective January 2024)\" effective_date=\"2024-01-01\" version=\"1.0\">\n## Company shutdown week\n\nDuring the company-wide shutdown week (between Rosh Hashanah and Yom Kippur), 3 vacation days are deducted automatically. Employees who do not have enough days will go into a negative balance, which is offset against future accruals.\n\n## Leaving the company\n\nUnused vacation days are paid out on termination according to Israeli law, based on the employee's last base salary.\n\n## Questions\n\nQuestions about this policy should be sent to the People team in the #ask-people Slack channel.\n</source>\n</sources>\n\n<question>How many unused vacation days can I carry over to next year, and when do they expire?</question>"
      expected: "{\"answer\": \"Up to 5 days, and carried-over days expire on March 31 (Vacation Policy 2026; the superseded 2024 policy allowed 3 days until February 28).\", \"answer_facts\": [\"up to 5 days can be carried over\", \"carried-over days expire on March 31\"], \"source_ids\": [\"hr-vacation-2026\"], \"stale_ids\": [\"hr-vacation-2024\"]}"
      doc_map: "{\"1\": \"hr-vacation-2026\", \"2\": \"hr-vacation-2024\", \"3\": \"hr-vacation-2026\", \"4\": \"hr-sick-leave\", \"5\": \"hr-vacation-2024\"}"
  - description: "q002 [version_conflict] What is the daily per diem for a business trip to a standard (not high"
    vars:
      qid: q002
      qtype: version_conflict
      question: "What is the daily per diem for a business trip to a standard (not high-cost) city?"
      user_message: "<sources>\n<source id=\"1\" doc=\"fin-travel-2025\" title=\"Travel Policy (2025)\" section=\"Travel Policy (effective January 2025)\" effective_date=\"2025-01-01\" version=\"1.0\">\n## Hotels\n\n- Standard cities: up to $180 per night.\n- High-cost cities (London, New York, San Francisco, Zurich, Paris): up to $260 per night.\n- Berlin office visits: up to 150 EUR per night.\n\n## Per diem\n\nThe per diem covers meals, local transport within the city, and small expenses. It is paid with the salary after the trip, based on the number of days abroad.\n\n| Destination | Per diem per day (USD) |\n|---|---|\n| Standard cities | $75 |\n| High-cost cities (London, New York, San Francisco, Zurich, Paris) | $95 |\n\nThe day of departure and the day of return count as full days when the flight leaves before 12:00 or lands after 18:00 local time; otherwise they count as half days.\n</source>\n<source id=\"2\" doc=\"fin-travel-2026\" title=\"Travel Policy (2026)\" section=\"Travel Policy (effective February 2026)\" effective_date=\"2026-02-01\" version=\"2.0\">\n## 3. Hotels\n\nHotel caps per night: up to $210 in standard cities and up to $300 in high-cost cities (London, New York, San Francisco, Zurich, Paris, Tokyo). Berlin office visits: employees must stay in the Acme corporate apartment when it is available. When it is not available, the hotel cap in Berlin is 170 EUR per night.\n\n## 4. Per diem\n\nThe per diem covers meals, local transport within the city, and small expenses. It is paid with the salary after the trip, based on the number of days abroad, according to this table:\n\nDestination | Per diem per day\nStandard cities | $85\nHigh-cost cities (London, New York, San Francisco, Zurich, Paris, Tokyo) | $110\nBerlin office visits | 65 EUR\n\nThe day of departure and the day of return count as full days when the flight leaves before 12:00 or lands after 18:00 local time; otherwise they count as half days. When meals are provided by a conference or a customer, the per diem for that day is reduced by 30%.\n</source>\n<source id=\"3\" doc=\"fin-travel-2026\" title=\"Travel Policy (2026)\" section=\"Travel Policy (effective February 2026)\" effective_date=\"2026-02-01\" version=\"2.0\">\n## 5. Domestic travel\n\nTrips between Tel Aviv and Haifa: the train is preferred. Private car use is reimbursed per the Business Expenses Policy. Overnight stays in Haifa for workshops: up to 650 NIS per night.\n\n## 6. Insurance and safety\n\nTravel health insurance is purchased centrally by Acme for every approved trip. Travelers to countries on the Security team's high-risk list must request a loaner laptop from IT at least 5 working days before the trip.\n\n## 7. Summary of changes from 2025\n\nPer diem increased from $75 to $85 in standard cities and from $95 to $110 in high-cost cities. Hotel caps increased from $180 to $210 (standard) and from $260 to $300 (high-cost). Premium economy is new for flights over 6 hours, business class for VPs now starts at 8 hours instead of 10, and Tokyo was added to the high-cost list.\n</source>\n<source id=\"4\" doc=\"fin-travel-2026\" title=\"Travel Policy (2026)\" section=\"Travel Policy (effective February 2026)\" effective_date=\"2026-02-01\" version=\"2.0\">\n# Travel Policy (effective February 2026)\n\nThis policy replaces the January 2025 Travel Policy. It covers business travel abroad and domestic travel between Acme offices, for employees and for contractors traveling on Acme's behalf. The per diem rates and hotel caps were raised to reflect higher prices in 2025.\n\n## 1. Approval and booking\n\nEvery trip abroad needs the approval of the department VP before booking. Trips are booked through TripDesk. Bookings made elsewhere are reimbursed only if they were cheaper than the TripDesk offer at the time of booking.\n\n## 2. Flights\n\nEconomy class is the default. On flights longer than 6 hours, all employees may book premium economy. VP-level employees and above may fly business class on flights longer than 8 hours. Book at least 14 days in advance when possible.\n</source>\n<source id=\"5\" doc=\"fin-travel-2025\" title=\"Travel Policy (2025)\" section=\"Travel Policy (effective January 2025)\" effective_date=\"2025-01-01\" version=\"1.0\">\n## Domestic travel\n\n- Trips between Tel Aviv and Haifa: train is preferred. Private car is reimbursed per the Business Expenses Policy.\n- Overnight stays in Haifa for workshops: up to 600 NIS per night.\n\n## Insurance\n\nTravel health insurance is purchased centrally by Acme for every approved trip. Do not buy your own.\n</source>\n</sources>\n\n<question>What is the daily per diem for a business trip to a standard (not high-cost) city?</question>"
      expected: "{\"answer\": \"$85 per day under the Travel Policy effective February 1, 2026 (it was $75 under the 2025 policy).\", \"answer_facts\": [\"$85 per day\", \"Travel Policy 2026\"], \"source_ids\": [\"fin-travel-2026\"], \"stale_ids\": [\"fin-travel-2025\"]}"
      doc_map: "{\"1\": \"fin-travel-2025\", \"2\": \"fin-travel-2026\", \"3\": \"fin-travel-2026\", \"4\": \"fin-travel-2026\", \"5\": \"fin-travel-2025\"}"
  - description: "q003 [version_conflict] What is the minimum password length, and do I have to change my passwo"
    vars:
      qid: q003
      qtype: version_conflict
      question: "What is the minimum password length, and do I have to change my password every 90 days?"
      user_message: "<sources>\n<source id=\"1\" doc=\"it-password-mfa-2026\" title=\"Password and MFA Policy (2026)\" section=\"Password and MFA Policy (effective January 15, 2026) &gt; Summary of changes from 2024\" effective_date=\"2026-01-15\" version=\"2.0\">\n## Summary of changes from 2024\n\n- Minimum length: from 10 to 14 characters.\n- Forced rotation every 90 days: removed.\n- SMS as a second factor: no longer allowed.\n- 1Password: from recommended to mandatory.\n- Lockout: from 5 attempts and 30 minutes to 10 attempts and 15 minutes.\n</source>\n<source id=\"2\" doc=\"it-password-policy-2024\" title=\"Password Policy (2024)\" section=\"Password Policy (effective June 2024)\" effective_date=\"2024-06-01\" version=\"1.0\">\n## Service accounts\n\nService account passwords are stored in the Platform team's vault and rotated every 180 days.\n\n## Reporting\n\nIf you suspect that a password was exposed, change it immediately and report it to security@acme.example.\n</source>\n<source id=\"3\" doc=\"it-password-policy-2024\" title=\"Password Policy (2024)\" section=\"Password Policy (effective June 2024)\" effective_date=\"2024-06-01\" version=\"1.0\">\n# Password Policy (effective June 2024)\n\n## Scope\n\nThis policy applies to every account used for Acme work: the Okta single sign-on account, accounts in SaaS tools that do not use Okta, local laptop accounts, and service accounts.\n\n## Password requirements\n\n- Passwords must be at least 10 characters long and include at least three of the following: uppercase letters, lowercase letters, digits, symbols.\n- Passwords must be changed every 90 days. The last 5 passwords cannot be reused.\n- Passwords must not contain the employee's name, the word \"acme\", or the name of the current month or season.\n</source>\n<source id=\"4\" doc=\"it-password-mfa-2026\" title=\"Password and MFA Policy (2026)\" section=\"Password and MFA Policy (effective January 15, 2026)\" effective_date=\"2026-01-15\" version=\"2.0\">\n## Account lockout\n\nAfter 10 failed login attempts, the Okta account is locked for 15 minutes. Repeated lockouts within a day are investigated by the Security team.\n\n## Service accounts\n\nService account credentials are stored in the Platform team's secret manager and rotated automatically every 90 days. Long-lived personal access tokens for GitHub are not allowed; use short-lived tokens issued through Okta.\n\n## Lost security key\n\nReport a lost security key to it@acme.example on the same day. IT revokes it and you continue with the backup key until a replacement is issued.\n</source>\n<source id=\"5\" doc=\"eng-pm-2026-08-api\" title=\"Postmortem: flow-api outage (August 19, 2026)\" section=\"Postmortem: flow-api outage on August 19, 2026\" effective_date=\"2026-08-26\" version=\"1.0\">\n## Root cause\n\nThe connection pool size of auth-service was changed from 200 to 20 by a typo in a configuration-only change. Configuration changes were deployed through Conveyor without the canary stage, so the change went to 100% of pods in both regions within 2 minutes. A canary at 5% would have shown the latency increase and rolled back automatically.\n\n## Contributing factors\n\n- No validation of configuration values (for example a minimum pool size).\n- flow-api's token validation cache (60 seconds) was too short to absorb the problem.\n- It took 12 minutes from the identity page to finding the change, because configuration changes were not shown in the auth-service dashboard.\n</source>\n</sources>\n\n<question>What is the minimum password length, and do I have to change my password every 90 days?</question>"
      expected: "{\"answer\": \"At least 14 characters, and there is no forced periodic rotation (only on suspected compromise). The 2024 rules of 10 characters and 90-day rotation were superseded in January 2026.\", \"answer_facts\": [\"minimum 14 characters\", \"no forced periodic rotation\"], \"source_ids\": [\"it-password-mfa-2026\"], \"stale_ids\": [\"it-password-policy-2024\"]}"
      doc_map: "{\"1\": \"it-password-mfa-2026\", \"2\": \"it-password-policy-2024\", \"3\": \"it-password-policy-2024\", \"4\": \"it-password-mfa-2026\", \"5\": \"eng-pm-2026-08-api\"}"
  - description: "q004 [version_conflict] How many days a week can employees work remotely?"
    vars:
      qid: q004
      qtype: version_conflict
      question: "How many days a week can employees work remotely?"
      user_message: "<sources>\n<source id=\"1\" doc=\"hr-remote-work-2026\" title=\"Remote Work Policy (2026)\" section=\"Remote Work Policy (effective March 2026)\" effective_date=\"2026-03-01\" version=\"2.0\">\n# Remote Work Policy (effective March 2026)\n\nThis policy replaces the January 2025 remote work policy. It was shaped by the 2025 engagement survey, in which 71% of employees asked for more flexibility while managers asked for predictable shared office days.\n\n## The rules\n\n- Employees may work remotely up to 2 days per week. Tuesday and Wednesday are office days for all teams.\n- Remote work from abroad requires written approval from the VP of the department and is limited to 10 working days per year.\n- Acme provides a one-time home office allowance of 1,500 NIS, claimed through the expense system within 60 days of the purchase.\n- Employees must be reachable on Slack during core hours, 10:00 to 16:00 Israel time.\n</source>\n<source id=\"2\" doc=\"hr-remote-work-2025\" title=\"Remote Work Policy (2025)\" section=\"Remote Work Policy (effective January 2025)\" effective_date=\"2025-01-01\" version=\"1.0\">\n# Remote Work Policy (effective January 2025)\n\n- Employees may work remotely 1 day per week, chosen together with the direct manager. Sunday to Thursday are office days by default.\n- Remote work from abroad is not permitted, except during approved business travel.\n- Acme provides a one-time home office allowance of 1,000 NIS, claimed through the expense system within 60 days of the purchase.\n- Employees must be reachable on Slack during core hours, 10:00 to 16:00 Israel time.\n- Teams may agree on additional remote days for specific periods (for example during a strike or extreme weather) with the approval of the department VP.\n- This policy will be reviewed by the People team by the end of 2025, based on the results of the employee engagement survey.\n</source>\n<source id=\"3\" doc=\"co-allhands-2026-01\" title=\"All-hands notes - January 2026\" section=\"All-hands notes: January 13, 2026\" effective_date=\"2026-01-13\" version=\"1.0\">\n## 4. People updates (Orly Peretz, VP People)\n\n- New vacation policy since January 1: 14 days in the first year, carry-over of up to 5 days.\n- New parental leave policy from April: more paid weeks for the birth parent and 15 paid days for the non-birth parent.\n- Remote work: Orly said that, starting in March, employees will be able to work remotely up to 3 days a week, with one shared office day. The final policy will be published in February.\n- Engagement survey results: 78% participation; flexibility was the top request.\n\n## 5. Q&amp;A (selected)\n\n- **Q: Will the travel per diem be updated? Prices went up a lot.** A (Avi Mizrahi): Yes, a new travel policy is coming in February with higher per diem rates.\n- **Q: When will Kestrel replace the engine completely?** A (Michal): Not before 2027.\n- **Q: Will Haifa get a bigger office?** A (Yael): We are looking at options for 2027; for now, Haifa has enough desks.\n</source>\n<source id=\"4\" doc=\"hr-remote-work-2026\" title=\"Remote Work Policy (2026)\" section=\"Remote Work Policy (effective March 2026)\" effective_date=\"2026-03-01\" version=\"2.0\">\n## Berlin office\n\nBerlin employees follow the same rule of up to 2 remote days per week. Their shared office days are Tuesday and Thursday, so that they overlap with Tel Aviv on Tuesday.\n\n## Exceptions\n\n- Employees returning from parental leave, employees with a medical recommendation, and employees after long reserve duty may agree on a temporary arrangement with more remote days, approved by the department VP and the People team.\n- Customer-facing roles may be asked to be in the office on specific days for customer visits.\n\n## Working from abroad\n\nRequests to work from abroad must be submitted at least 3 weeks in advance. The employee is responsible for being reachable during core hours in Israel time, and the request must be checked by Finance for tax implications if it exceeds 5 consecutive working days.\n</source>\n<source id=\"5\" doc=\"hr-vacation-2026\" title=\"Vacation Policy (2026)\" section=\"Vacation Policy (effective January 2026)\" effective_date=\"2026-01-01\" version=\"2.0\">\n## Company shutdown week\n\nDuring the company-wide shutdown week (between Rosh Hashanah and Yom Kippur), 3 vacation days are deducted automatically. On-call engineers who work during the shutdown week keep those days and may use them later in the year.\n\n## What changed compared to 2024\n\n- First-year allowance increased from 12 to 14 days, and the maximum from 22 to 24 days.\n- Carry-over increased from 3 to 5 days, and the expiry date moved from February 28 to March 31.\n- The advance notice for requests of 3 days or more increased from 1 week to 2 weeks.\n\n## Questions\n\nQuestions about this policy should be sent to the People team in the #ask-people Slack channel or to Sivan Elbaz, HR Manager.\n</source>\n</sources>\n\n<question>How many days a week can employees work remotely?</question>"
      expected: "{\"answer\": \"Up to 2 days per week; Tuesday and Wednesday are office days for all teams (policy effective March 2026). The January 2026 all-hands mention of 3 days was corrected in July, and the 2025 policy (1 day) is superseded.\", \"answer_facts\": [\"up to 2 remote days per week\", \"Tuesday and Wednesday are office days\"], \"source_ids\": [\"co-allhands-2026-07\", \"hr-remote-work-2026\"], \"stale_ids\": [\"co-allhands-2026-01\", \"hr-remote-work-2025\"]}"
      doc_map: "{\"1\": \"hr-remote-work-2026\", \"2\": \"hr-remote-work-2025\", \"3\": \"co-allhands-2026-01\", \"4\": \"hr-remote-work-2026\", \"5\": \"hr-vacation-2026\"}"
  - description: "q005 [version_conflict] Which team owns flow-scheduler?"
    vars:
      qid: q005
      qtype: version_conflict
      question: "Which team owns flow-scheduler?"
      user_message: "<sources>\n<source id=\"1\" doc=\"co-org-chart\" title=\"Acme Org Chart Summary\" section=\"Acme Org Chart Summary (October 2026) &gt; Engineering (reports to Michal Ben-David)\" effective_date=\"2026-10-01\" version=\"2026-10\">\n## Engineering (reports to Michal Ben-David)\n\n- Core API team: lead Itai Barak, 7 people. Owns flow-api.\n- Engine team: lead Dana Levi, 8 people. Owns flow-engine and flow-scheduler, and runs the Kestrel project.\n- Integrations team: lead Omer Haddad, 7 people. Owns connectors-hub and notifications.\n- Billing team: lead Rina Sasson, 6 people. Owns billing-service.\n- Identity team: lead Gil Avraham, 5 people. Owns auth-service.\n- Frontend team: lead Maya Rosen, 7 people. Owns web-app.\n- Data team: lead Eitan Klein, 6 people. Owns lighthouse and the data pipelines.\n- Platform team: lead Boaz Nahum, 7 people. Owns the Kubernetes clusters, Conveyor, databases, Kafka and observability.\n\nEngineering has 53 people in total in its eight teams, plus the VP Engineering.\n</source>\n<source id=\"2\" doc=\"eng-architecture\" title=\"Acme Flow Architecture Overview\" section=\"Acme Flow Architecture Overview &gt; 10. What is changing\" effective_date=\"2026-09-20\" version=\"3.3\">\n## 10. What is changing\n\n- **Kestrel:** a rewrite of the execution layer of `flow-engine` with a new storage model for checkpoints. Kestrel runs in shadow mode for 5% of runs since June 2026.\n- **Config changes through canary:** after the August 2026 incident, configuration changes go through the same canary stage as code (see the Deploy Process).\n- **Scheduler ownership:** a proposal to move `flow-scheduler` to the Platform team is under discussion; until the Service Catalog changes, the Engine team owns it.\n</source>\n<source id=\"3\" doc=\"eng-deploy-process\" title=\"Deploy Process for Acme Flow\" section=\"Deploy Process for Acme Flow &gt; Responsibilities\" effective_date=\"2026-09-01\" version=\"2.2\">\n## Responsibilities\n\n- The author of the change is responsible for watching the canary and the dashboards until the rollout is complete.\n- The owning team's on-call engineer must be aware of deploys to Tier 1 services during their shift.\n- The Platform team owns Conveyor itself; problems with the pipeline go to #platform-help or the platform-oncall rotation.\n</source>\n<source id=\"4\" doc=\"eng-service-catalog\" title=\"Engineering Service Catalog\" section=\"Engineering Service Catalog\" effective_date=\"2026-09-15\" version=\"2026-09\">\n## On-call rules that apply to every rotation\n\n- Each rotation has a primary and a secondary. The secondary is paged if the primary does not acknowledge in time.\n- Engineers join a rotation as primary only after 90 days at Acme and at least one week as a shadow.\n- Handover happens in the rotation's Slack channel with a short written summary of open issues.\n- Runbooks exist for flow-api, flow-engine and billing-service; the flow-scheduler on-call notes are in Hebrew in the Engine team space.\n\n## Recent ownership changes\n\n- April 2026: notifications moved from Core API to Integrations.\n- A proposal to move flow-scheduler from Engine to Platform was discussed in May 2026 and postponed. Engine remains the owner.\n</source>\n<source id=\"5\" doc=\"eng-architecture\" title=\"Acme Flow Architecture Overview\" section=\"Acme Flow Architecture Overview &gt; 2. High-level picture\" effective_date=\"2026-09-20\" version=\"3.3\">\n## 2. High-level picture\n\nRequests reach Acme Flow through two doors:\n\n1. **The web app** (`web-app`), a React single-page application that customers use to build and monitor workflows. It talks only to the public API.\n2. **The public API** (`flow-api`), a REST API used by the web app, by customers' own code, and by inbound webhooks from third-party tools.\n\nBehind the API, the main services are:\n\n- **auth-service:** identity, login, OAuth2/OIDC token issuing and validation, SAML single sign-on for Business and Enterprise customers, and API keys. Every request to `flow-api` is authenticated by calling `auth-service` (with a short local cache of validated tokens, 60 seconds).\n- **flow-scheduler:** owns time-based triggers (cron-like schedules) and delayed steps. It decides *when* a run should start and publishes a \"run requested\" message.\n- **flow-engine:** the heart of the platform. It consumes \"run requested\" messages, loads the workflow definition, and executes steps one by one on a pool of workers, persisting the state of each run after every step so that a run can resume after a crash.\n- **connectors-hub:** the integration layer with about 240 connectors to third-party tools. It stores customers' connection credentials (encrypted) and executes actions and polling triggers against third-party APIs, with per-connector rate limiting.\n</source>\n</sources>\n\n<question>Which team owns flow-scheduler?</question>"
      expected: "{\"answer\": \"The Engine team (lead Dana Levi). A May 2026 decision to move it to Platform was postponed, and the Service Catalog still lists Engine.\", \"answer_facts\": [\"Engine team owns flow-scheduler\", \"Dana Levi is the lead\", \"move to Platform was postponed\"], \"source_ids\": [\"eng-service-catalog\"], \"stale_ids\": [\"eng-leads-sync-2026-05\"]}"
      doc_map: "{\"1\": \"co-org-chart\", \"2\": \"eng-architecture\", \"3\": \"eng-deploy-process\", \"4\": \"eng-service-catalog\", \"5\": \"eng-architecture\"}"
