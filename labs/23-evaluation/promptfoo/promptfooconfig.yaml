  - description: "q073 [unanswerable] What was Acme's ARR at the end of 2023?"
    vars:
      qid: q073
      qtype: unanswerable
      question: "What was Acme's ARR at the end of 2023?"
      user_message: "<sources>\n<source id=\"1\" doc=\"co-allhands-2026-07\" title=\"All-hands notes - July 2026\" section=\"All-hands notes: July 14, 2026\" effective_date=\"2026-07-14\" version=\"1.0\">\n# All-hands notes: July 14, 2026\n\nHeld in Haifa this time, streamed to Tel Aviv and Berlin. Notes by the Marketing team. The official policies are the source of truth.\n\n## 1. First half of 2026 (Yael Shapira, CEO)\n\n- ARR at the end of June: $21.1M.\n- About 1,950 customer organizations on all plans.\n- Enterprise is the fastest-growing plan: 38 new Enterprise customers in H1, 14 of them in Germany and Austria.\n- Berlin has 13 people. The goal of 25 by the end of the year has been reduced to 18, because of the slower hiring market.\n</source>\n<source id=\"2\" doc=\"co-allhands-2026-01\" title=\"All-hands notes - January 2026\" section=\"All-hands notes: January 13, 2026\" effective_date=\"2026-01-13\" version=\"1.0\">\n## 2. Plans for 2026 (Yael)\n\n- Target ARR for the end of 2026: $23M.\n- Grow the Berlin office to 25 people by the end of 2026 (Sales EMEA and Customer Support EMEA).\n- New pricing took effect on January 1 (Daniel will send details to customer-facing teams).\n\n## 3. Engineering (Amir Katz, CTO, and Michal Ben-David)\n\n- Kestrel kicked off: the rewrite of the execution layer of the engine. First milestone is shadow mode in mid-2026.\n- Reliability: 2025 ended with 99.96% average monthly availability for flow-api.\n- The Orca migration is fully done; the last services moved in November 2025.\n</source>\n<source id=\"3\" doc=\"co-allhands-2026-01\" title=\"All-hands notes - January 2026\" section=\"All-hands notes: January 13, 2026\" effective_date=\"2026-01-13\" version=\"1.0\">\n# All-hands notes: January 13, 2026\n\nHeld in Tel Aviv, streamed to Haifa and Berlin. Notes taken by the Marketing team for employees who could not attend. These notes summarize what was said in the meeting; the official policies are the source of truth.\n\n## 1. 2025 in numbers (Yael Shapira, CEO)\n\n- ARR at the end of 2025: $18.4M, up from $14.9M at the end of 2024.\n- Customers: 1,870 paying and free organizations, of which 610 are on paid plans.\n- Net revenue retention: 112%.\n- Headcount grew from 96 to 114 during 2025.\n- Tidewater went live in October: EU customers can keep their data in Frankfurt. 48 customers chose EU residency so far.\n</source>\n<source id=\"4\" doc=\"sales-sla-2026\" title=\"Acme Flow Service Level Agreement (2026)\" section=\"Acme Flow Service Level Agreement (2026)\" effective_date=\"2026-01-01\" version=\"2.0\">\n## 3. Requesting credits\n\nCustomers must request credits through Customer Support within 30 days after the end of the affected month. Acme may also issue credits proactively after a major incident. Credits are applied to the next invoice and are not paid out in cash.\n\n## 4. Scheduled maintenance\n\nScheduled maintenance takes place in the weekly maintenance window, Sunday 02:00 to 06:00 UTC, and is announced at least 72 hours in advance on the status page. Scheduled maintenance of up to 4 hours per month does not count as unavailability.\n\n## 5. Exclusions\n\nUnavailability does not count against uptime when it is caused by third-party services outside Acme's control (including connected third-party tools), by the customer's own actions or configuration, by suspension of the account for non-payment or abuse, or by force majeure.\n</source>\n<source id=\"5\" doc=\"it-laptop-policy\" title=\"Laptop and Endpoint Policy\" section=\"Laptop and Endpoint Policy\" effective_date=\"2025-08-01\" version=\"1.3\">\n## Travel\n\nLaptops travel as carry-on, never in checked luggage. When traveling to countries on the Security team's high-risk list, request a loaner laptop from IT at least 5 working days before the trip.\n\n## Leaving Acme\n\nReturn the laptop, chargers, security keys and monitors to IT on your last working day. Berlin employees return equipment to Katrin Vogel, the Berlin office manager.\n\n## Buying out the old laptop\n\nAt the end of the 3-year cycle, employees may buy their old laptop for a symbolic 300 NIS after IT wipes it. MacBook Pros used for production access are not sold; they are recycled.\n</source>\n</sources>\n\n<question>What was Acme's ARR at the end of 2023?</question>"
      expected: "{\"answer\": \"not in the documents\", \"answer_facts\": [], \"source_ids\": [], \"stale_ids\": []}"
